<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <!-- Βασικά SEO meta tags - καθαρός, επαγγελματικός τίτλος/περιγραφή
         όταν εμφανίζεται στα αποτελέσματα αναζήτησης. Το πλούσιο
         marketing περιεχόμενο (features, τιμές, FAQ) ζει στο
         sharethecap.gr - εδώ είναι η ίδια η πλατφόρμα/εφαρμογή. -->
    <meta name="description" content="Sharethecap - Το ψηφιακό άλμπουμ φωτογραφιών του event σας. Οι καλεσμένοι σας ανεβάζουν φωτογραφίες και βίντεο μέσω QR code, χωρίς εφαρμογή." />
    <link rel="canonical" href="https://sharethecap.com/" />

    <!-- Open Graph / Twitter - καθαρή προεπισκόπηση όταν μοιράζεται το link -->
    <meta property="og:title" content="Sharethecap - Μπες στο πάρτι" />
    <meta property="og:description" content="Ανέβασε τις φωτογραφίες και τα βίντεό σου από την εκδήλωση, μέσω QR code, χωρίς εφαρμογή." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sharethecap.com/" />
    <meta property="og:image" content="https://sharethecap.com/graph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sharethecap.com/graph.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />

    <!-- PWA: manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A2238" />

    <!-- PWA: iOS-specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShareTheCap" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>Sharethecap | Ανέβασε φωτογραφίες από το event</title>

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        max-width: 100vw;
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: hidden;
        background-color: #16325C;
        -webkit-text-size-adjust: 100%;
        position: fixed;
        touch-action: pan-y;
      }
      .wedding-title {
        font-family: 'STIX Two Text', serif !important;
      }
      .klev-viewport {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        overflow-y: hidden;
        box-sizing: border-box;
      }
      .klev-scroll-area {
        flex: 1;
        width: 100%;
        max-width: 480px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
